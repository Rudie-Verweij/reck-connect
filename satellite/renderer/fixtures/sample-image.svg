<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Dev/e2e fixture only: a stand-in image for the markdown harness, so the
       viewer's image handling (lazy attributes, lightbox) can be exercised
       without reaching the network.

       Deliberately WIDER than the popup's reading column. That is the case the
       lightbox exists for — an image the viewer clamps with `max-width: 100%`
       and which you therefore can't see at full size without opening it. A
       small image would make the lightbox test vacuous, since the in-flow copy
       is already at natural size. -->
  <rect width="1600" height="900" fill="#2b2b33" />
  <circle cx="450" cy="450" r="230" fill="#d97757" />
  <rect x="800" y="260" width="600" height="380" rx="24" fill="#6a9fb5" />
  <text x="800" y="820" font-family="system-ui, sans-serif" font-size="64" fill="#e8e8ea" text-anchor="middle">sample image 1600×900</text>
</svg>
